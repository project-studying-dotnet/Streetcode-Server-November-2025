# This is a basic workflow to help you get started with Actions

name: UnitTestsWorkflow

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches:
    - main 
    - dev
  pull_request:
    branches:
    - main 
    - dev
    types: [opened, synchronize, reopened]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  unit_tests_branch:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      working-directory: Streetcode
      run: dotnet build Streetcode.sln --configuration Release --no-restore

    - name: Run Unit Tests
      working-directory: Streetcode
      run: dotnet test Streetcode.XUnitTest/Streetcode.XUnitTest.csproj --configuration Release --no-build

    