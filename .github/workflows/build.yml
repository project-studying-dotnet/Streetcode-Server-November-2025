name: SonarCloud

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud_branch:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧱 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 🛠 Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: 📦 Restore Dependencies
        run: dotnet restore ./Streetcode/Streetcode.sln

      - name: 🚀 SonarScanner Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner begin `
          /k:"ita-social-projects_StreetCode" `
          /o:"ita-social-projects" `
          /d:sonar.branch.name="${{ github.ref_name }}" `
          /d:sonar.token="$env:SONAR_TOKEN" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.cobertura.xml" `
          /d:sonar.coverage.exclusions="**/*Tests.cs,**/*Test.cs"

      - name: 🏗 Build
        run: dotnet build ./Streetcode/Streetcode.sln --configuration Release --no-restore

      - name: ✅ Test and Generate Coverage (Cobertura)
        run: |
          dotnet test ./Streetcode/Streetcode.XUnitTest/Streetcode.XUnitTest.csproj `
            --configuration Release `
            /p:CollectCoverage=true `
            /p:CoverletOutput=./TestResults/ `
            /p:CoverletOutputFormat=cobertura

      - name: ☁️ SonarScanner End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: 📤 Upload Coverage Report (для відлагодження)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cobertura Report
          path: TestResults/coverage.cobertura.xml
