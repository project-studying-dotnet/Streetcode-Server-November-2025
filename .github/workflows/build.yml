name: SonarCloud

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud_branch:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ensure dotnet tools PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet tool install xmldocmd -g

      - name: Restore Dependencies
        working-directory: Streetcode
        run: dotnet restore Streetcode.sln

      - name: SonarScanner Begin
        working-directory: Streetcode
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # 1. Look for 'coverage.opencover.xml'
        # 2. Exclude the coverage folder itself from analysis so it doesn't show up in the "Code" tab
        run: |
          dotnet sonarscanner begin /k:"ita-social-projects_StreetCode" /o:"ita-social-projects" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.coverage.exclusions="**/*Tests.cs,**/*Test.cs" /d:sonar.exclusions="**/bin/**/*,**/obj/**/*,**/Migrations/**/*,**/coverage/**/*"

      - name: Build
        working-directory: Streetcode
        run: dotnet build Streetcode.sln --configuration Release --no-restore

      - name: Test and Code Coverage
        working-directory: Streetcode
        # Generates the raw Cobertura file
        run: dotnet test Streetcode.XUnitTest/Streetcode.XUnitTest.csproj --configuration Release --results-directory ./coverage --collect:"XPlat Code Coverage" --no-build

      - name: Convert Coverage Report
        working-directory: Streetcode
        # FIX: Convert Cobertura -> OpenCover (The format the C# scanner actually wants)
        run: reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage -reporttypes:OpenCover

      - name: SonarScanner End
        working-directory: Streetcode
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Publish Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Code Coverage Report
          path: Streetcode/coverage/coverage.opencover.xml