name: SonarCloud

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore Streetcode/Streetcode.sln

      - name: Build
        run: dotnet build Streetcode/Streetcode.sln --configuration Release --no-restore

      - name: Test + Coverage
        run: |
          dotnet test Streetcode/Streetcode.XUnitTest/Streetcode.XUnitTest.csproj \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./TestResults/coverage.xml

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"ita-social-projects_StreetCode" \
            /o:"ita-social-projects" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportPaths="Streetcode/Streetcode.XUnitTest/TestResults/coverage.xml"

          dotnet build Streetcode/Streetcode.sln --configuration Release

          dotnet-sonarscanner end /d:sonar.login="$SONAR_TOKEN"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: Streetcode/Streetcode.XUnitTest/TestResults/coverage.xml
